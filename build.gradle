plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'io.freefair.lombok' version '8.4' // Use the latest stable version
}

group = 'com.science'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	maven { url 'https://jitpack.io' }
}

configurations.configureEach {
	// Exclude conflicting logging implementations
	exclude group: 'org.slf4j', module: 'slf4j-reload4j'
	exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
	exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'



	resolutionStrategy {
		// patch vunaribility
		eachDependency { DependencyResolveDetails details ->
			if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-compress') {
				details.useVersion '1.26.0'
				details.because 'Mitigate CVE-2024-25710'
			}
			if (details.requested.group == 'io.github.classgraph' && details.requested.name == 'classgraph') {
				details.useVersion '4.8.112'
				details.because 'Mitigate CVE-2021-47621'
			}
		}
	}
}


dependencies {

	//*****************************************************************************
	// * swagger
	//*****************************************************************************
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

	//*****************************************************************************
	// * springboot implementation
	//*****************************************************************************
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// springboot hot reload
	developmentOnly("org.springframework.boot:spring-boot-devtools")

	//*************************************************************
	// onnx
	//*************************************************************
	implementation 'com.microsoft.onnxruntime:onnxruntime:1.18.0'

	//*************************************************************
	// * image operations
	//*************************************************************
	implementation 'net.coobird:thumbnailator:0.4.20'

	//*****************************************************************************
	//*****************************************************************************
	// * test implementation
	//*****************************************************************************
	//*****************************************************************************

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//*****************************************************************************
	// * springboot:test implementation
	//*****************************************************************************
	testImplementation 'org.springframework.boot:spring-boot-starter-web'

}

bootRun {
	maxHeapSize = "2048m"
	jvmArgs([
			'--add-modules', 'jdk.incubator.vector',
			'--enable-preview',
			"--add-opens=java.base/java.lang=ALL-UNNAMED",
			"--add-opens=java.base/java.lang.invoke=ALL-UNNAMED",
			"--add-opens=java.base/java.util=ALL-UNNAMED",
			"--add-opens=java.base/java.nio=ALL-UNNAMED",
			"--add-opens=java.base/java.io=ALL-UNNAMED",
			"--add-opens=java.base/java.net=ALL-UNNAMED",
			"--add-opens=java.base/sun.nio.ch=ALL-UNNAMED",
			// CORRECTED: java.security is in java.base
			"--add-opens=java.base/java.security=ALL-UNNAMED",
			'--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
	])
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs([
			"-Dorg.bytedeco.javacpp.maxbytes=8G",        // Total native memory limit
			"-Dorg.bytedeco.javacpp.maxphysicalbytes=16G", // Total system memory limit (Heap + Native)
			'--add-modules', 'jdk.incubator.vector',
			'--enable-preview',
			"--add-opens=java.base/java.lang=ALL-UNNAMED",
			"--add-opens=java.base/java.lang.invoke=ALL-UNNAMED",
			"--add-opens=java.base/java.util=ALL-UNNAMED",
			"--add-opens=java.base/java.io=ALL-UNNAMED",
			"--add-opens=java.base/java.net=ALL-UNNAMED",
			"--add-opens=java.base/java.nio=ALL-UNNAMED",
			"--add-opens=java.base/sun.nio.ch=ALL-UNNAMED",
			// CORRECTED: java.security is in java.base
			"--add-opens=java.base/java.security=ALL-UNNAMED",
			'-Xmx10g'
	])

	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true // Helps see your df.show() output
	}
}


